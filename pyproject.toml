[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cf-datascience-fs"
dynamic = ["version"]
description = "fsspec filesystem (cfds://) for reading and writing a remote storage drive over HTTP, with OIDC sign-in."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["fsspec", "filesystem", "remote", "data science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "aiohttp>=3.8",
    "fsspec>=2024.2.0",
    "requests>=2.25",
    "urllib3>=1.26",
]

[project.optional-dependencies]
# Needed by cfds-server only with --oidc-issuer (token signature checks).
server = [
    "PyJWT[crypto]>=2.8",
]
test = [
    "cf-datascience-fs[server]",
    "pytest>=7.3",
    "pandas",
    "pyarrow",
]
dev = [
    "cf-datascience-fs[test]",
    "ruff==0.17.*",
]

[project.urls]
Repository = "https://github.com/sweeden-ttu/cf-datascience-fs"

[project.scripts]
cfds = "cf_datascience_fs.cli:main"
cfds-server = "cf_datascience_fs.server:main"

# Makes fsspec.open("cfds://host:port/path") work without an explicit import.
[project.entry-points."fsspec.specs"]
cfds = "cf_datascience_fs.asyn:CFDataScienceAsyncFileSystem"
cfdss = "cf_datascience_fs.asyn:CFDataScienceAsyncFileSystem"

[tool.hatch.version]
path = "src/cf_datascience_fs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_datascience_fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The test drive holds a 5 MiB file; do not keep a copy per test after the run.
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.format]
# Code samples in the README use aligned trailing comments.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
