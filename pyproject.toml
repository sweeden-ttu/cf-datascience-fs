[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cf-datascience-fs"
dynamic = ["version"]
description = "Read-only fsspec filesystem (cfds://) for browsing and reading a remote storage drive over HTTP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["fsspec", "filesystem", "remote", "data science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec>=2024.2.0",
    "requests>=2.25",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "pandas",
    "pyarrow",
]
dev = [
    "cf-datascience-fs[test]",
    "ruff",
]

[project.urls]
Repository = "https://github.com/sweeden-ttu/cf-datascience-fs"

[project.scripts]
cfds-server = "cf_datascience_fs.server:main"

# Makes fsspec.open("cfds://host:port/path") work without an explicit import.
[project.entry-points."fsspec.specs"]
cfds = "cf_datascience_fs.core:CFDataScienceFileSystem"
cfdss = "cf_datascience_fs.core:CFDataScienceFileSystem"

[tool.hatch.version]
path = "src/cf_datascience_fs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cf_datascience_fs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
