name: Publish VS Code extension

# Push a tag like vscode-v0.1.0 to publish. Needs the repository secret VSCE_PAT
# (Azure DevOps token with Marketplace > Manage) and, optionally, OVSX_PAT for Open VSX.
on:
  push:
    tags: ["vscode-v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: vscode-extension

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run typecheck
      - name: Check the tag matches package.json
        run: test "vscode-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run package
      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --no-dependencies --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx publish *.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
