# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && xcodegen generate
# then open CloudfrontsFS.xcodeproj. The .xcodeproj is generated, not committed.
name: CloudfrontsFS
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  CFDSKit:
    path: CFDSKit
targets:
  CloudfrontsFS:
    type: application
    platform: iOS
    sources:
      - path: CloudfrontsFS
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: Cloudfronts
        PRODUCT_BUNDLE_IDENTIFIER: $(CFDS_BUNDLE_ID)
        INFOPLIST_FILE: CloudfrontsFS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: CloudfrontsFS/CloudfrontsFS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CFDSKit
      - target: CloudfrontsFSFileProvider
        embed: true
  CloudfrontsFSFileProvider:
    type: app-extension
    platform: iOS
    sources:
      - path: FileProvider
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_NAME: CloudfrontsFileProvider
        PRODUCT_BUNDLE_IDENTIFIER: $(CFDS_BUNDLE_ID).FileProvider
        INFOPLIST_FILE: FileProvider/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FileProvider/FileProvider.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: CFDSKit
schemes:
  CloudfrontsFS:
    build:
      targets:
        CloudfrontsFS: all
        CloudfrontsFSFileProvider: all
    run:
      config: Debug
    archive:
      config: Release
